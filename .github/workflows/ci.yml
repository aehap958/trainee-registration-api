name: Complete CI Security Pipeline (Week 1)

on:
  push:
    branches: [ "main" ]

# تطبيق مبدأ الصلاحيات الأقل للـ Pipeline (Least Privilege IAM/Permissions)
permissions:
  contents: read

jobs:
  security-ci:
    runs-on: ubuntu-latest

    steps:
    # 1. سحب الكود
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 2. تجهيز بايثون
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 3. تثبيت المكتبات وأدوات الفحص
    - name: Install Dependencies & Security Tools
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install bandit pip-audit

    # 4. فحص الكود الثابت (SAST)
    - name: Run SAST (Bandit)
      run: bandit -r app.py lambda_function.py

    # 5. فحص المكتبات (SCA)
    - name: Run SCA (pip-audit)
      run: pip-audit -r requirements.txt

    # 6. فحص التسريبات والكلمات السرية (Secrets Scanning)
    - name: Run Secrets Scanning (TruffleHog)
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        extra_args: --only-verified

    # 7. الفحص الديناميكي للتطبيق وهو شغال (DAST)
    - name: Run DAST (Dynamic API Security Check)
      run: |
        python app.py &
        SERVER_PID=$!
        sleep 3
        echo "Testing API Security Headers & Endpoints..."
        curl -f -i http://127.0.0.1:5000/
        curl -f -X POST http://127.0.0.1:5000/register -H "Content-Type: application/json" -d '{"name":"Test","email":"test@example.com","track":"Cloud"}'
        kill $SERVER_PID

    # 8. تجميع الكود وتوقيعه رقمياً (Artifact Signing)
    - name: Package & Sign Artifact
      run: |
        # ضغط ملفات التطبيق في ملف واحد (Artifact)
        tar -czf trainee-api-artifact.tar.gz app.py requirements.txt
        
        # إنشاء مفتاح تشفير وتوقيع الملف رقمياً لضمان عدم التلاعب به
        gpg --batch --passphrase "" --quick-generate-key "CI-Signer <ci@trainee-app.local>" default default never
        gpg --armor --detach-sign trainee-api-artifact.tar.gz
        
        # التحقق من صحة التوقيع
        gpg --verify trainee-api-artifact.tar.gz.asc trainee-api-artifact.tar.gz

    # 9. حفظ الملف الموقع والمخرجات كـ Deliverable
    - name: Upload Signed Artifact
      uses: actions/upload-artifact@v4
      with:
        name: signed-release-package
        path: |
          trainee-api-artifact.tar.gz
          trainee-api-artifact.tar.gz.asc