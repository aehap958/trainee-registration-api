name: Complete CI Security Pipeline (Week 1)

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  security-ci:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies & Security Tools
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install bandit pip-audit

    - name: Run SAST (Bandit)
      run: bandit -r app.py lambda_function.py

    - name: Run SCA (pip-audit)
      run: pip-audit -r requirements.txt

    - name: Run Secrets Scanning (TruffleHog)
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        extra_args: --only-verified

    - name: Run DAST (Dynamic API Security Check)
      run: |
        python app.py &
        SERVER_PID=$!
        sleep 3
        echo "Testing API Security Headers & Endpoints..."
        curl -f -i http://127.0.0.1:5000/
        curl -f -X POST http://127.0.0.1:5000/register -H "Content-Type: application/json" -d '{"name":"Test","email":"test@example.com","track":"Cloud"}'
        kill $SERVER_PID

    - name: Package & Sign Artifact
      run: |
        # 1. إنشاء ملف الضغط خارج المجلد الحالي تماماً لتجنب خطأ التداخل
        tar -czf ../trainee-api-artifact.tar.gz --exclude='.git' --exclude='.github' --exclude='__pycache__' .
        
        # 2. نقل الملف الجاهز إلى مجلد المشروع الحالي
        mv ../trainee-api-artifact.tar.gz .
        
        # 3. توقيع الملف رقمياً
        gpg --batch --passphrase "" --quick-generate-key "CI-Signer <ci@trainee-app.local>" default default never
        gpg --armor --detach-sign trainee-api-artifact.tar.gz
        
        gpg --verify trainee-api-artifact.tar.gz.asc trainee-api-artifact.tar.gz
    - name: Upload Signed Artifact
      uses: actions/upload-artifact@v4
      with:
        name: signed-release-package
        path: |
          trainee-api-artifact.tar.gz
          trainee-api-artifact.tar.gz.asc