name: Complete CD Deployment Pipeline (Week 1)
run-name: "CD Deploy: ${{ github.event.workflow_run.head_commit.message || 'Auto Deploy' }}"

on:
  workflow_run:
    workflows: ["Complete CI Security Pipeline (Week 1)"]
    types:
      - completed

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    env:
      AWS_REGION: eu-west-1
      IAM_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4.2.2

    - name: Download Artifact from CI
      uses: actions/download-artifact@v4
      with:
        name: signed-release-package
        github-token: ${{ secrets.GITHUB_TOKEN }}
        run-id: ${{ github.event.workflow_run.id }}

    - name: Authenticate via AWS IAM Role
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ env.IAM_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Verify Signed Artifact & Deploy to AWS Lambda
      run: |
        echo "Extracting prepared files..."
        mkdir -p deploy_files
        tar -xzf trainee-api-artifact.tar.gz -C deploy_files/
        
        echo "Packaging all changes for AWS..."
        cd deploy_files
        zip -r ../deploy_package.zip .
        cd ..
        
        echo "Deploying changes to AWS Lambda ($AWS_REGION)..."
        # تأكد من أن TraineeAPI هو اسم الدالة الفعلي في حسابك على AWS
        aws lambda update-function-code --function-name TraineeAPI --zip-file fileb://deploy_package.zip
        
        echo "Deployment completed securely!"