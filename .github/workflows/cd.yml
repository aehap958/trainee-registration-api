name: Complete CD Deployment Pipeline (Week 1)
run-name: "CD Deploy: ${{ github.event.workflow_run.head_commit.message || 'Auto Deploy' }}"

on:
  workflow_run:
    workflows: ["Complete CI Security Pipeline (Week 1)"]
    types:
      - completed

# تم تحديد الصلاحيات للقراءة فقط لأننا نستخدم مفاتيح الأمان للمصادقة
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    env:
      AWS_REGION: eu-west-1
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4.2.2

    - name: Download Artifact from CI
      uses: actions/download-artifact@v4
      with:
        name: signed-release-package
        github-token: ${{ secrets.GITHUB_TOKEN }}
        run-id: ${{ github.event.workflow_run.id }}

    # خطوة المصادقة باستخدام المفاتيح التي تمت إضافتها في GitHub Secrets
    - name: Authenticate via AWS Access Keys
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    # خطوة التجهيز والرفع الفعلي للكود على AWS Lambda
    - name: Verify Signed Artifact & Deploy to AWS Lambda
      run: |
        echo "Extracting prepared files..."
        mkdir -p deploy_files
        tar -xzf trainee-api-artifact.tar.gz -C deploy_files/
        
        echo "Packaging all changes for AWS..."
        cd deploy_files
        zip -r ../deploy_package.zip .
        cd ..
        
        echo "Deploying changes to AWS Lambda ($AWS_REGION)..."
        # أمر التحديث الفعلي لدالة TraineeAPI
        aws lambda update-function-code --function-name TraineeAPI --zip-file fileb://deploy_package.zip
        
        echo "Deployment completed securely and successfully!"